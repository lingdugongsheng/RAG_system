<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服 - 多代理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e6f7ff 0%, #b3e0ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 123, 255, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }

        .chat-header {
            background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chat-header i {
            font-size: 1.5rem;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9fbfd;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border: 1px solid #e8f0fe;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* 客服系统特有的信息行 */
        .meta-info {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e8f0fe;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .meta-item {
            background: #f0f7ff;
            padding: 4px 12px;
            border-radius: 12px;
            color: #1677ff;
            font-weight: 500;
        }

        .escalation-badge {
            background: #fff1f0;
            color: #ff4d4f;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        .confidence-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        .confidence-high { background: #d9f7be; color: #52c41a; }
        .confidence-medium { background: #fff7e6; color: #fa8c16; }
        .confidence-low { background: #fff1f0; color: #ff4d4f; }

        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e8f0fe;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            background: #f9fbfd;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.1);
        }

        #message-input {
            flex: 1;
            border: none;
            padding: 14px 18px;
            font-size: 1rem;
            outline: none;
            resize: none;
            background: transparent;
            color: #333;
        }

        #message-input::placeholder { color: #999; }
        #message-input:focus { box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.2); }

        .send-btn {
            background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
            color: white;
            border: none;
            width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            border-radius: 16px;
        }

        .send-btn:hover {
            background: linear-gradient(135deg, #0958d9 0%, #003eb3 100%);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading-indicator {
            text-align: center;
            padding: 10px;
            color: #1677ff;
            font-size: 0.9rem;
        }

        .spinner {
            border: 2px solid rgba(22, 119, 255, 0.3);
            border-top: 2px solid #1677ff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .welcome-icon {
            font-size: 3.5rem;
            color: #1677ff;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1677ff;
            margin-bottom: 12px;
        }

        .welcome-text {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .status-bar {
            background: #f0f7ff;
            padding: 8px 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #e8f0fe;
        }

        .status-connected { color: #52c41a; }
        .status-disconnected { color: #ff4d4f; }

        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #1677ff; border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-thumb:hover { background: #0958d9; }

        @media (max-width: 768px) {
            .chat-container { height: 90vh; max-width: 100%; border-radius: 16px; }
            .message { max-width: 95%; }
            .chat-header { font-size: 1.1rem; padding: 15px; }
            .welcome-icon { font-size: 2.5rem; }
            .welcome-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <i class="fas fa-headset"></i>
            <span>多代理智能客服</span>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="welcome-message">
                <div class="welcome-icon"><i class="fas fa-robot"></i></div>
                <h2 class="welcome-title">您好，我是智能客服助手</h2>
                <p class="welcome-text">
                    我拥有技术支持、订单服务、产品咨询等多个专业能力，<br>
                    请直接描述您的问题，我将为您提供准确帮助。
                </p>
                <p class="welcome-text" style="font-size: 0.85rem; color: #999;">
                    后端地址: <code>http://localhost:8000</code>
                </p>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="chat-input">
                <textarea id="message-input" placeholder="请输入您的问题... " rows="1"></textarea>
                <button class="send-btn" id="send-message" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="loading-indicator" id="loading-indicator" style="display: none;">
                <div class="spinner"></div>
                <div>AI 正在处理中...</div>
            </div>
        </div>

        <div class="status-bar">
            <span id="api-status">API状态: <span class="status-disconnected">未连接</span></span>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 配置 ====================
            const API_BASE_URL = 'http://localhost:8000';
            const chatMessages = document.getElementById('chat-messages');
            const messageInput = document.getElementById('message-input');
            const sendMessageBtn = document.getElementById('send-message');
            const loadingIndicator = document.getElementById('loading-indicator');
            const apiStatusEl = document.getElementById('api-status');

            let isLoading = false;

            // ==================== 安全转义函数（XSS 防护） ====================
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ==================== UI 工具函数 ====================
            function showLoading() {
                isLoading = true;
                loadingIndicator.style.display = 'block';
                sendMessageBtn.disabled = true;
                messageInput.disabled = true;
            }

            function hideLoading() {
                isLoading = false;
                loadingIndicator.style.display = 'none';
                sendMessageBtn.disabled = false;
                messageInput.disabled = false;
            }

            function removeWelcomeIfPresent() {
                const welcome = document.querySelector('.welcome-message');
                if (welcome) welcome.remove();
            }

            function getConfidenceClass(confidence) {
                if (confidence >= 0.8) return 'confidence-high';
                if (confidence >= 0.6) return 'confidence-medium';
                return 'confidence-low';
            }

            function getIntentLabel(intent) {
                const labels = {
                    'tech_support': '技术支持',
                    'order_service': '订单服务',
                    'product_consult': '产品咨询',
                    'escalate': '人工升级'
                };
                return labels[intent] || intent;
            }

            function addMessage(content, isUser = false, meta = {}) {
                removeWelcomeIfPresent();

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;

                if (isUser) {
                    messageDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
                } else {
                    const safeContent = escapeHtml(content).replace(/\n/g, '<br>');
                    let metaHtml = '';

                    // 构建元信息（意图、置信度、质量评分、升级状态）
                    if (meta.intent || meta.confidence || meta.quality_score || meta.escalated) {
                        let items = [];
                        if (meta.intent) {
                            items.push(`<span class="meta-item">📋 意图：${escapeHtml(getIntentLabel(meta.intent))}</span>`);
                        }
                        if (meta.confidence !== undefined) {
                            const confClass = getConfidenceClass(meta.confidence);
                            items.push(`<span class="confidence-badge ${confClass}">🎯 置信度：${(meta.confidence * 100).toFixed(0)}%</span>`);
                        }
                        if (meta.quality_score !== undefined) {
                            items.push(`<span class="meta-item">⭐ 质量：${(meta.quality_score * 100).toFixed(0)}%</span>`);
                        }
                        if (meta.escalated) {
                            items.push(`<span class="escalation-badge">⚠️ 已建议升级人工</span>`);
                        }
                        if (items.length) {
                            metaHtml = `<div class="meta-info">${items.join('')}</div>`;
                        }
                    }

                    messageDiv.innerHTML = `<div class="message-content">${safeContent}</div>${metaHtml}`;
                }

                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai-message';
                errorDiv.innerHTML = `<div class="message-content" style="color: #ff4d4f;">❌ ${escapeHtml(message)}</div>`;
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // ==================== API 调用 ====================
            async function checkApiConnection() {
                try {
                    const response = await fetch(`${API_BASE_URL}/health`);
                    if (response.ok) {
                        apiStatusEl.innerHTML = 'API状态: <span class="status-connected">已连接</span>';
                        return true;
                    } else {
                        apiStatusEl.innerHTML = 'API状态: <span class="status-disconnected">连接失败</span>';
                        return false;
                    }
                } catch (error) {
                    apiStatusEl.innerHTML = 'API状态: <span class="status-disconnected">连接失败</span>';
                    console.error('API 连接失败:', error);
                    return false;
                }
            }

            async function sendQuery() {
                const question = messageInput.value.trim();
                if (!question || isLoading) return;

                addMessage(question, true);
                messageInput.value = '';
                messageInput.style.height = 'auto';
                showLoading();

                try {
                    const response = await fetch(`${API_BASE_URL}/query`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: question, use_history: true })
                    });

                    if (!response.ok) {
                        let detail = `服务器错误 (${response.status})`;
                        try {
                            const errorData = await response.json();
                            detail = errorData.detail || detail;
                        } catch (_) { /* 忽略 JSON 解析错误 */ }
                        throw new Error(detail);
                    }

                    const data = await response.json();

                    // 构建元数据对象
                    const meta = {
                        intent: data.intent,
                        confidence: data.confidence,
                        quality_score: data.quality_score,
                        escalated: data.escalated
                    };

                    addMessage(data.answer, false, meta);
                } catch (error) {
                    showError(`请求失败: ${error.message}`);
                    console.error('查询错误:', error);
                } finally {
                    hideLoading();
                }
            }

            // ==================== 事件绑定 ====================
            document.addEventListener('DOMContentLoaded', async () => {
                await checkApiConnection();

                sendMessageBtn.addEventListener('click', sendQuery);

                messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendQuery();
                    }
                });

                messageInput.addEventListener('input', () => {
                    messageInput.style.height = 'auto';
                    messageInput.style.height = messageInput.scrollHeight + 'px';
                    sendMessageBtn.disabled = messageInput.value.trim() === '';
                });

                setTimeout(() => messageInput.focus(), 300);
            });
        })();
    </script>
</body>
</html>
